<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <title>Sign up - Job Board</title>
  </head>
  <body>
    <nav class="navbar bg-body border-bottom">
      <div class="container">
        <a class="navbar-brand" href="/">Job Board</a>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
          <h1 class="h2 fw-bold text-center">Create an account</h1>
          <p class="text-body-secondary text-center mb-4">
            Your details are saved in your profile and sent with each application.
          </p>

          <form id="signup-form" class="card card-body p-4 shadow-sm">
            <div class="mb-3">
              <label class="form-label fw-semibold" for="name">Name</label>
              <input id="name" class="form-control" autocomplete="name" required />
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold" for="email">Email</label>
              <input
                id="email"
                class="form-control"
                type="email"
                autocomplete="email"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold" for="phone">Phone</label>
              <input id="phone" class="form-control" type="tel" autocomplete="tel" />
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold" for="password">Password</label>
              <input
                id="password"
                class="form-control"
                type="password"
                autocomplete="new-password"
                required
              />
            </div>

            <button id="submit" class="btn btn-primary w-100" type="submit">
              Create account
            </button>
            <div id="error" role="alert" hidden></div>
          </form>

          <p class="text-center mt-3 mb-0">
            Already have an account? <a href="/login.html">Log in</a>
          </p>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/signup.js"></script>
  </body>
</html>
