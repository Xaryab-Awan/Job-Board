<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <title>Administration - Job Board</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-md bg-body border-bottom sticky-top">
      <div class="container">
        <a class="navbar-brand" href="/">Job Board</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#nav-menu"
          aria-controls="nav-menu"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav-menu">
          <ul class="navbar-nav ms-auto align-items-md-center" id="nav-links"></ul>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <h1 class="h2 fw-bold mb-1">Administration</h1>
      <p class="text-body-secondary mb-3">
        Create, edit and delete the records of every table.
      </p>

      <ul class="nav nav-tabs mb-3" id="tabs"></ul>

      <form id="admin-form" class="card card-body shadow-sm mb-3" novalidate>
        <h2 class="h6 fw-bold mb-3" id="form-title">Add a job</h2>
        <div class="row g-2" id="form-fields"></div>
        <div id="form-error" role="alert" hidden></div>
        <div class="d-flex gap-2 mt-3">
          <button id="save" class="btn btn-primary btn-sm" type="submit">Add</button>
          <button id="cancel" class="btn btn-outline-secondary btn-sm" type="button" hidden>
            Cancel
          </button>
        </div>
      </form>

      <div id="table-message" role="alert" hidden></div>

      <div class="card shadow-sm mt-3">
        <div class="table-responsive">
          <table class="table table-hover align-middle small mb-0">
            <thead class="table-light" id="thead"></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-3">
        <span id="page-info" class="small text-body-secondary"></span>
        <div class="d-flex gap-2">
          <button id="prev" class="btn btn-outline-secondary btn-sm" type="button">
            Previous
          </button>
          <button id="next" class="btn btn-outline-secondary btn-sm" type="button">Next</button>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/admin.js"></script>
  </body>
</html>
