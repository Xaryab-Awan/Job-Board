<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <title>My applications - Job Board</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-md bg-body border-bottom sticky-top">
      <div class="container">
        <a class="navbar-brand" href="/">Job Board</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#nav-menu"
          aria-controls="nav-menu"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav-menu">
          <ul class="navbar-nav ms-auto align-items-md-center" id="nav-links"></ul>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <h1 class="h2 fw-bold mb-0">My applications</h1>
      <p id="count" class="text-body-secondary mb-3" aria-live="polite">
        Follow the status of the jobs you applied to.
      </p>

      <div class="card shadow-sm overflow-hidden">
        <div id="list" class="list-group list-group-flush"></div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/applications.js"></script>
  </body>
</html>
