<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container">
    <div class="row justify-content-center mt-5">
      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h3 mb-4 text-center">Create an account</h1>

            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input id="name" class="form-control">
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input id="email" type="email" class="form-control">
            </div>
            <div class="mb-3">
              <label for="phone" class="form-label">Phone</label>
              <input id="phone" class="form-control">
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input id="password" type="password" class="form-control">
            </div>

            <div id="error" class="text-danger small mb-2"></div>
            <button id="submit" class="btn btn-primary w-100">Create account</button>

            <p class="text-center mt-3 mb-0">Already have an account? <a href="/login.html">Log in</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/signup.js"></script>
</body>
</html>
